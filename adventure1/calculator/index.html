<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Calculator</title>
</head>

<body>
    <header class="header">
        <div class="backToMainMenu">
            <a href="../index.html" class="backMenu">Вернуться</a>
        </div>
    </header>
    <main class="main-container">
        <div class="title">
            <h1>Calculator</h1>
        </div>
        <div class="input-form">
            <input type="number" class="number-one" data-number-one placeholder="Введите первое число">
            <input type="number" class="number-two" data-number-two placeholder="Введите второе число">
        </div>
        <div class="button-form">
            <button class="plus" data-plus>+</button>
            <button class="minus" data-minus>-</button>
            <button class="share" data-share>/</button>
            <button class="multiply" data-multiply>*</button>
        </div>

        <p>Результат</p>
        <p class="result" data-number-result></p>
    </main>
</body>

</html>
